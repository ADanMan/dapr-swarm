[project]
name = "dapr-swarm-local"
version = "0.4.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dapr-agents==1.1.0",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "beautifulsoup4>=4.13,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
